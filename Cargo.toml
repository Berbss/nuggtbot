[package]
name = "nuggtbot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twitch-irc = { version = "5", default-features = false, features = ["transport-tcp", "transport-tcp-rustls-webpki-roots"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-recursion = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
libloading = "0.8"

# Desktop system-tray (optional). The default build is headless (server only);
# desktop release artifacts are built with `--features tray`.
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }
open = { version = "5", optional = true }
resvg = { version = "0.44", optional = true }

[features]
# Off by default so the server/systemd build needs no GUI/GTK libraries.
tray = ["dep:tray-icon", "dep:tao", "dep:open", "dep:resvg"]

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
